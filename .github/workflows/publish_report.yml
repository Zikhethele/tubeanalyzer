name: Publish YouTube Report

on:
  repository_dispatch:
    types: [publish-report]

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create report directory
        run: |
          mkdir -p reports/${{ github.event.client_payload.channel_name }}

      - name: Validate payload
        run: |
          if [ -z "${{ github.event.client_payload.content_b64 }}" ]; then
            echo " Missing Base64 payload"
            exit 1
          fi
          
      - name: Decode and write HTML
        run: |
          echo "${{ github.event.client_payload.content_b64 }}" \
            | base64 --decode > index.html
          
      - name: Commit and push
        run: |
          git config user.name "TubeAnalyzer Bot"
          git config user.email "bot@tubeanalyzer.local"
          git add reports/
          git commit -m "Publish report for ${{ github.event.client_payload.channel_name }}" || exit 0
          git push
