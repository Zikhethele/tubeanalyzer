name: TubeAnalyzer Worker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  run-worker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, pdo, pdo_pgsql
          ini-values: |
            date.timezone=UTC

      - name: Validate DATABASE_URL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "❌ DATABASE_URL is MISSING"
            exit 1
          else
            echo "✅ DATABASE_URL is set"
          fi

      - name: Run pending channels worker
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: php pending_channels.php
