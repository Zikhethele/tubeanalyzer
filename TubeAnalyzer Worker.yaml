name: TubeAnalyzer Worker

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes
  workflow_dispatch:

jobs:
  run-worker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, pdo, pdo_mysql
          ini-values: |
            date.timezone=UTC

      # ---- FAIL FAST IF SECRETS ARE MISSING ----
      - name: Validate required environment variables
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_PORT: ${{ secrets.DB_PORT }}
        run: |
          for var in DB_HOST DB_NAME DB_USER DB_PASS DB_PORT; do
            if [ -z "${!var}" ]; then
              echo "❌ $var is MISSING"
              exit 1
            else
              echo "✅ $var is set"
            fi
          done

      # ---- RUN WORKER ----
      - name: Run pending channels worker
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_PORT: ${{ secrets.DB_PORT }}
        run: |
          php pending_channels.php
